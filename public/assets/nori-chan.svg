<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 320" role="img" aria-labelledby="nt nd">
  <title id="nt">Nori-chan</title>
  <desc id="nd">Nori-chan, a cheerful sushi-shop owner in a pink kimono, matcha apron and chef headband, holding a tray of sushi.</desc>
  <defs>
    <style>.o{stroke:#4a3036;stroke-width:4.5;stroke-linejoin:round;stroke-linecap:round}</style>
  </defs>
  <ellipse cx="130" cy="306" rx="78" ry="10" fill="#4a3036" opacity=".14"/>
  <!-- back hair -->
  <path class="o" d="M58 120 q-6 70 26 96 l92 0 q32 -26 26 -96 z" fill="#2b2547"/>
  <!-- body / kimono -->
  <path class="o" d="M78 196 q-20 40 -18 104 l140 0 q2 -64 -18 -104 q-52 -20 -104 0z" fill="#ff9fbf"/>
  <path d="M86 214 l44 40 l44 -40" fill="none" stroke="#fff6e8" stroke-width="9" stroke-linecap="round"/>
  <path class="o" d="M86 214 l44 40 l44 -40" fill="none" stroke-width="3"/>
  <!-- sakura pattern on kimono -->
  <g fill="#fff6e8" opacity=".85">
    <circle cx="82" cy="276" r="5"/><circle cx="182" cy="268" r="5"/><circle cx="100" cy="292" r="3.5"/><circle cx="168" cy="292" r="3.5"/>
  </g>
  <!-- matcha apron -->
  <path class="o" d="M98 248 l64 0 l6 52 l-76 0z" fill="#8fb573"/>
  <text x="130" y="282" text-anchor="middle" font-family="'Zen Maru Gothic','Hiragino Maru Gothic ProN',sans-serif" font-weight="900" font-size="20" fill="#fff6e8">のり</text>
  <rect class="o" x="92" y="236" width="76" height="14" rx="6" fill="#e8504a"/>
  <!-- tray arms -->
  <ellipse class="o" cx="74" cy="236" rx="14" ry="12" fill="#ffe3cf"/>
  <ellipse class="o" cx="186" cy="236" rx="14" ry="12" fill="#ffe3cf"/>
  <!-- sushi geta tray -->
  <rect class="o" x="62" y="208" width="136" height="20" rx="6" fill="#d79a62"/>
  <rect class="o" x="74" y="226" width="12" height="10" fill="#b07345"/>
  <rect class="o" x="174" y="226" width="12" height="10" fill="#b07345"/>
  <g class="o">
    <ellipse cx="96" cy="204" rx="17" ry="9" fill="#fff"/>
    <rect x="78" y="188" width="36" height="13" rx="6.5" fill="#ec5b5b"/>
    <ellipse cx="130" cy="204" rx="17" ry="9" fill="#fff"/>
    <rect x="112" y="188" width="36" height="13" rx="6.5" fill="#ff9a62"/>
    <ellipse cx="164" cy="204" rx="17" ry="9" fill="#fff"/>
    <rect x="146" y="188" width="36" height="13" rx="6.5" fill="#ffd65c"/>
  </g>
  <rect x="160" y="188" width="8" height="22" fill="#2f4a2e" stroke="#4a3036" stroke-width="3"/>
  <!-- neck + head -->
  <rect x="120" y="164" width="20" height="20" fill="#ffe3cf"/>
  <ellipse class="o" cx="130" cy="112" rx="70" ry="64" fill="#ffe3cf"/>
  <!-- bangs -->
  <path class="o" d="M60 116 q0 -66 70 -68 q70 2 70 68 q-14 -10 -22 -30 q-10 18 -30 20 q6 -10 4 -22 q-14 22 -44 24 q8 -8 8 -20 q-18 18 -56 28z" fill="#2b2547"/>
  <!-- side locks -->
  <path class="o" d="M62 112 q-6 40 6 66 q10 -18 8 -60z" fill="#2b2547"/>
  <path class="o" d="M198 112 q6 40 -6 66 q-10 -18 -8 -60z" fill="#2b2547"/>
  <!-- hachimaki headband -->
  <path class="o" d="M62 86 q68 -30 136 0 l-2 12 q-66 -28 -132 0z" fill="#fff"/>
  <circle class="o" cx="130" cy="72" r="7" fill="#e8504a" stroke-width="3"/>
  <path class="o" d="M196 90 q22 -6 30 -22 q-6 22 -26 32z M198 94 q24 6 34 22 q-22 -6 -36 -14z" fill="#fff"/>
  <!-- nori hair clip -->
  <rect class="o" x="74" y="98" width="20" height="9" rx="2" fill="#2f4a2e" transform="rotate(-20 84 102)"/>
  <!-- face -->
  <ellipse cx="104" cy="128" rx="10" ry="13" fill="#4a3036"/>
  <ellipse cx="156" cy="128" rx="10" ry="13" fill="#4a3036"/>
  <circle cx="108" cy="123" r="4" fill="#fff"/><circle cx="160" cy="123" r="4" fill="#fff"/>
  <circle cx="101" cy="133" r="2" fill="#fff"/><circle cx="153" cy="133" r="2" fill="#fff"/>
  <ellipse cx="88" cy="148" rx="11" ry="6.5" fill="#ff8096" opacity=".55"/>
  <ellipse cx="172" cy="148" rx="11" ry="6.5" fill="#ff8096" opacity=".55"/>
  <path class="o" d="M120 146 q10 12 20 0 q-10 4 -20 0z" fill="#ff7a8a" stroke-width="3.5"/>
</svg>
