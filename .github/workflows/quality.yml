name: Game quality
on:
  pull_request:
  push:
    branches: [main, codex/quality-v1]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:premium-build
      - run: npm audit --audit-level=high
